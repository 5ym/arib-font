name: build

# PR と main: 作って確かめる。タグ vX.Y: 作って確かめて Releases に置く。
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+$' || { echo "タグは vX.Y: $GITHUB_REF_NAME"; exit 1; }
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - name: Toolchain
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: denpa-font-tools
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.v.outputs.epoch }}
        run: |
          run() { docker run --rm -v "$PWD:/w" -e VERSION -e SOURCE_DATE_EPOCH denpa-font-tools "$@"; }
          run sh ./build.sh
          # 同じ入力から同じバイト列になること (build/ と dist/ はコンテナの root が書く)
          cp dist/SHA256SUMS first.sha256
          run sh ./build.sh > /dev/null
          diff first.sha256 dist/SHA256SUMS

      - name: Previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # denpa-font.ttf を持つ一番新しいリリース (いま作るタグは除く)
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName'); do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            if gh release view "$tag" --json assets -q '.assets[].name' | grep -qx denpa-font.ttf; then
              gh release download "$tag" -p denpa-font.ttf -O prev.ttf
              echo "PREV=$tag" >> "$GITHUB_ENV"
              break
            fi
          done

      - name: Verify
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/w" denpa-font-tools \
            python3 -I scripts/verify.py dist/denpa-font.ttf build/merged.ttf ${PREV:+prev.ttf} | tee verify.txt
          {
            echo "Denpa Font ${GITHUB_REF_NAME}"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "確かめた結果 (前の版: ${PREV:-なし})"
            echo
            echo '```'
            cat verify.txt
            echo '```'
          } > notes.md
          cp notes.md "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: denpa-font
          path: |
            dist/
            notes.md

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: denpa-font
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            dist/denpa-font.ttf dist/denpa-font.woff2 dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
